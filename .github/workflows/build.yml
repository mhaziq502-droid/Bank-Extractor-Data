name: Build Windows EXE

# Builds a standalone Windows .exe automatically.
# Download it from the "Artifacts" section of each run, or from the
# Release that is created when you push a version tag like v1.0.0.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # lets you trigger a build manually from the Actions tab

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: Run tests
        run: pytest -q
        continue-on-error: true

      - name: Build EXE with PyInstaller
        run: pyinstaller --noconfirm BankExtractor.spec

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: BankExtractor-windows
          path: dist/BankExtractor.exe
          if-no-files-found: error

      - name: Attach EXE to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BankExtractor.exe

# ---------------------------------------------------------------------------
# Category keyword map  -  EDIT THIS FILE to tune how transactions are categorized.
#
# How it works:
#   * Each category lists keywords (case-insensitive substring match) that are
#     checked against the transaction's Counterparty / Description.
#   * The FIRST category (top to bottom) with a matching keyword wins, so order
#     matters: put more specific categories above more general ones.
#   * "P2P / Individuals" and "Profit Earned" are usually assigned by the
#     classifier (method/type) rather than keywords, but keywords still help.
#
# Note: account-holder own-name transfers and own-pocket (Internal) movements
# are detected by the classifier, NOT here, so they never land in a spending
# category.
# ---------------------------------------------------------------------------

